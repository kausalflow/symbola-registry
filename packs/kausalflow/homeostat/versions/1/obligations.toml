[[obligation]]
id = "issues.operator-parameters"
statement = "Operator parameters are checked when the scenario is built: an unknown parameter name, a missing required parameter (each one), a value that is not a number (a boolean, or a string that does not read as a number; the string 2 counts as the number 2) or out of the declared range (tau and std at least 0, Kc at least 0) is E_BAD_PARAM; zero is inside a range that starts at 0."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["scenario-issues#example:30", "scenario-issues#example:31", "scenario-issues#example:32", "scenario-issues#example:33", "scenario-issues#example:34", "scenario-issues#example:107", "scenario-issues#example:119"]

[[obligation]]
id = "issues.single-writer"
statement = "Every signal has exactly one writer: an operator id that another operator or an exogenous source already writes is E_DUPLICATE_OPERATOR together with E_DUPLICATE_WRITER; a signal an input reads that nobody writes is E_UNKNOWN_SIGNAL."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["scenario-issues#example:36", "scenario-issues#example:37", "scenario-issues#example:40", "scenario-issues#example:41", "scenario-issues#example:111"]

[[obligation]]
id = "issues.wiring"
statement = "Inputs must be connected (E_MISSING_INPUT, per input, a sum having one input per weight), only existing ports may be wired (E_UNKNOWN_PORT), an operator period must be a whole multiple of dt (E_BAD_PERIOD), an unknown operator is E_UNKNOWN_OP, and `from` in an exogenous entry must name a port of a unit (E_UNKNOWN_TARGET at `exogenous[i].target`)."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["scenario-issues#example:73", "scenario-issues#example:38", "scenario-issues#example:39", "scenario-issues#example:35", "scenario-issues#example:29", "scenario-issues#example:46", "scenario-issues#example:47", "scenario-issues#example:88"]

[[obligation]]
id = "issues.algebraic-loops"
statement = "A cycle in which every operator has direct feedthrough from the previous one is rejected as E_ALGEBRAIC_LOOP with the cycle as its location (ids in the direction of the signal flow joined by ' -> ', closed by repeating the first); an operator without feedthrough (a lag, an integrator) on the cycle makes it valid. The contract rotates the path to start at the smallest id; where the original starts is incidental."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["scenario-issues#example:43", "scenario-issues#example:44", "scenario-issues#example:45", "scenario-issues#test_a_loop_of_algebraic_operators_is_reported_once_as_a_closed_path_from_its_smallest_id", "scenario-issues#example:98"]

[[obligation]]
id = "issues.feedback-reads-measured"
statement = "A controller's process-variable input must be the end of an observation chain, so that controllers read measured values and never true ones: otherwise E_BAD_FEEDBACK_INPUT at `<id>.pv`."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["scenario-issues#example:42"]

[[obligation]]
id = "issues.event-targets"
statement = "An event or a regime value may change only a schedule or a float parameter path `<operator>.<param>`: the regulated variable of a loop is E_TARGET_REGULATED (change its reference), a controller output E_TARGET_CONTROLLER_OUTPUT (switch to manual), anything else another operator writes E_TARGET_NOT_SCHEDULABLE, and a name that is neither a signal nor a parameter E_UNKNOWN_TARGET."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["scenario-issues#example:48", "scenario-issues#example:49", "scenario-issues#example:50", "scenario-issues#example:51", "scenario-issues#example:52", "scenario-issues#example:62", "scenario-issues#example:64", "scenario-issues#example:63", "scenario-issues#test_what_an_event_may_target_follows_the_graph", "scenario-issues#example:92", "scenario-issues#example:93"]

[[obligation]]
id = "issues.event-fields"
statement = "An intervention is rejected with E_BAD_EVENT when its time is negative, a ramp has no positive duration, a lane is outside the run's lanes, the mode of a loop is changed other than by a step, or a mode name is not MAN, AUTO or CAS."
