name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "git+https://github.com/kausalflow/symbolon@$(cat .symbolon-version)"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: registry-site/build.sh site https://kausalflow.github.io /symbolon-registry
      # Publish to the gh-pages branch, leaving PR previews in place.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          clean-exclude: pr-preview/
          force: false
