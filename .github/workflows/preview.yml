name: Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: github.event.action != 'closed'
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: "22"
      - name: Build
        if: github.event.action != 'closed'
        run: |
          pip install "git+https://github.com/kausalflow/symbolon@$(cat .symbolon-version)"
          registry-site/build.sh site https://${{ github.repository_owner }}.github.io /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}
      # Publishes to gh-pages under pr-preview/pr-<n>/, comments the URL on the PR,
      # and removes the preview when the PR closes. Forks lack write access, so skip them.
      - uses: rossjrw/pr-preview-action@v1
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
