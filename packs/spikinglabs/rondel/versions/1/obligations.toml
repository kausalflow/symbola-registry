# Obligations of the spikinglabs/rondel spec pack (format: docs/PACK_FORMAT.md).
#
# Each obligation is one decision a builder could get wrong, with the checks
# that pin it down. status: decided (required), default (chosen; a fork may
# change it with a note), open (deliberately undecided; builds may differ).
# Checks are "<component>#example:<line in examples.jsonl>" or
# "<component>#<property test name>". A required obligation no check can
# express yet has checks = [] and unchecked = "<the check it would need>".

[[obligation]]
id = "meeting.title"
statement = "A new meeting's title is the explicit title (trimmed), else the template's title with `{date}` (the day, ISO) and `{month}` filled in, else `<template name> – <date>`; titles are trimmed and cut to 200 characters."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["meeting#example:1", "meeting#example:2", "meeting#example:3", "meeting#example:4", "meeting#test_texts_are_trimmed_and_cut"]

[[obligation]]
id = "meeting.start-phase"
statement = "A meeting starts in the phase of its first board stage (write, group, vote, discuss or actions); a retro without board stages starts in write; a general meeting without one has no board phase; the template's per-stage `screen` is kept."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["meeting#example:3", "meeting#example:5", "meeting#example:6"]

[[obligation]]
id = "meeting.settings"
statement = "Settings start from the type's defaults (a retro: anonymous cards, 5 votes per person, 3 per card, secret voting; a general meeting: names shown, 3 votes per person, 1 per card), then the saved defaults of the browser, then the template's own settings, which win; `settings` later merges fields into the current ones."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["meeting#example:1", "meeting#example:3", "meeting#example:7", "meeting#example:44"]

[[obligation]]
id = "meeting.series-meeting"
statement = "A meeting made for a series stores the series reference and name, and its facilitators are the series' facilitators instead of only the creator."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["meeting#example:8"]

[[obligation]]
id = "meeting.ids-from-seed"
statement = "With a seed, every id a start creates (columns, agenda items, the meeting's own) is a pure function of the seed, the kind and the position: two browsers starting a series meeting from the same seed get identical ids, another seed gives other ids, and the seed is read as UTF-16 code units, so a long seed or an emoji works. Without a seed ids are random."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["meeting#example:9", "meeting#example:10", "meeting#example:11", "meeting#test_ids_come_from_the_seed_only"]

[[obligation]]
id = "meeting.prefilled-notes"
