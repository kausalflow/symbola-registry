kind = "behaviour"
checks = ["room#example:15", "room#example:22", "room#example:23", "room#example:24", "room#example:25"]

[[obligation]]
id = "room.limits"
statement = "A frame holds at most 2,000,000 characters, a room at most 25,000,000 characters of stored data (exactly that many are accepted, one more is refused), and a room at most 100 connections."
status = "decided"
source = "extract"
kind = "constraint"
reason = "The server holds sealed data for free and in memory-bound runtimes (a Durable Object, a SQLite file); the limits keep one room from exhausting it."
