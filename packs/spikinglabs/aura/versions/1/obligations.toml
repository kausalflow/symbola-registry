# Obligations of the spikinglabs/aura spec pack (format: docs/PACK_FORMAT.md).
#
# Each obligation is one decision a builder could get wrong, with the checks
# that pin it down. status: decided (required), default (chosen; a fork may
# change it with a note), open (deliberately undecided; builds may differ).
# Checks are "<component>#example:<line in examples.jsonl>" or
# "<component>#<property test name>". A required obligation no check can
# express yet has checks = [] and unchecked = "<the check it would need>".

[[obligation]]
id = "product.no-advice"
statement = "The app never gives medical, dose or diagnosis advice: no amount, no 'give', no illness named, no treatment. It shows reminders (the fixed rules of the reminders component), and when a medicine's minimum gap has passed. Every AI prompt carries the same rule, and an AI answer is only ever sorted into entries or a handover the parent reads. Schedules (vaccinations, checkups, dental) only remind of the published recommendation and say that the pediatrician decides; the app never signs in to a calendar."
status = "decided"
source = "extract"
kind = "constraint"
reason = "The product is a log and a reminder, not a medical device; the parents' doctor decides."
checks = []
unchecked = "A review of every screen text, reminder and AI prompt (a list of all prompt texts and all reminder texts) for dose, diagnosis or treatment wording; each prompt states the rule."

[[obligation]]
id = "merge.newest-wins"
statement = "Logs merge item by item, matched by id: an item of the other copy replaces the local one only if its updatedAt is strictly greater (missing counts as 0); on a tie the local item stays. Items are never combined field by field."
status = "decided"
source = "extract"
kind = "behaviour"
assumes = ["K-device-clocks", "K-ids-unique"]
checks = ["merge#example:2", "merge#example:3", "merge#example:4", "merge#example:8", "merge#test_the_newer_item_wins_and_a_tie_keeps_local"]

[[obligation]]
id = "merge.tombstones"
statement = "A deletion is an item that stays with deleted true and a newer updatedAt, and is merged like any edit: a newer deletion wins, a later edit brings the item back, an older deletion loses."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["merge#example:5", "merge#example:6", "merge#example:7", "merge#test_a_deletion_is_never_forgotten_by_a_merge"]

[[obligation]]
id = "merge.order"
statement = "The merged list keeps the local items in their order (a replaced item keeps its place), then appends the other copy's new items in their order; merging the same copy again changes nothing."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["merge#example:1", "merge#example:2", "merge#test_order_is_local_first_then_new_items_of_incoming", "merge#test_merging_again_changes_nothing"]

[[obligation]]
id = "merge.collections"
statement = "All 14 synced collections (children, episodes, entries, meds, measurements, growth, products, vaccines, checkups, dental, appts, emergency, docs, pages) merge this way; a collection the other copy lacks is left alone. Anything new that syncs must be added to this list."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["merge#example:9"]

[[obligation]]
id = "merge.example-data"
statement = "A log that only holds example data is replaced by an empty log (settings kept) before merging, so example items never mix with real ones."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["merge#example:10"]

[[obligation]]
id = "merge.selected-child"
statement = "After a merge the selected child stays; without one, the first child that is not deleted is selected, else none."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["merge#example:11", "merge#example:12"]

[[obligation]]
id = "merge.accept"
statement = "Only Aura logs are merged in (app 'aura' or the old 'sick-day-log'); a log of a newer format version is refused with a message to update, and an older one is first brought up to the current format."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["merge#example:13", "merge#example:14", "merge#example:15", "merge#example:16", "merge#example:17"]

[[obligation]]
id = "merge.foreign-file"
statement = "A Drive file counts as an Aura log only if app is 'aura' or 'sick-day-log' and entries is a list; the app never writes over anything else."
status = "decided"
source = "extract"
kind = "security"
checks = ["merge#example:24", "merge#example:25", "merge#example:26", "merge#example:27", "merge#example:28"]

[[obligation]]
id = "merge.covered"
statement = "After writing, the app checks that nothing of the phone's was lost to another phone's write: every item of the phone must be in the remote copy with at least its updatedAt."
