kind = "behaviour"
checks = ["meeting#example:12"]

[[obligation]]
id = "meeting.next-meeting"
statement = "A next meeting from a previous one copies the settings (votes hidden again) and the template, carries over open actions (each keeping the origin of its first meeting) and the previous meeting's unfinished extra topics, and records the previous title."
