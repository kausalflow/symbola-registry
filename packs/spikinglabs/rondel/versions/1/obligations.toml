statement = "The calendar file is an iCalendar text: CRLF lines folded at 75 octets, text escaped, one event starting at the series' first meeting time for its length, repeating weekly (`FREQ=WEEKLY`), every second week (`INTERVAL=2`), monthly, or daily as every weekday (`BYDAY=MO,TU,WE,TH,FR`), with no rule for an irregular series, and the agenda and link in the description and location."
