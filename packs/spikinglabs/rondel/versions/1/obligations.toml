checks = ["room#example:8"]

[[obligation]]
id = "room.updates"
statement = "An `upd` is stored with the next consecutive number, acknowledged to the sender with the sender's id and seq, and passed to the others (never echoed); presence (`aw`) is passed on, never stored or echoed; peers messages carry each receiver's own count."
