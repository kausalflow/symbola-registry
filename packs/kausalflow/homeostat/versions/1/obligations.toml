[[obligation]]
id = "truth.independent-of-randomness"
statement = "The signal table, loops, roles, causal graph, event log, promoted parameters and timeline follow from the scenario alone: they do not depend on the seed, the noise, the initial state or any simulated value."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["scenario-truth#example:17", "scenario-truth#test_ground_truth_does_not_depend_on_the_seed_noise_or_initial_state"]

[[obligation]]
id = "truth.signal-table"
statement = "There is one signal per operator output, named by the operator's id (sorted), with its writer, the writer's operator name, the kind of operator (source, dynamic, feedback, observation), the declared unit ('' if none, null for a promoted parameter) and whether the historian records it: measured signals and every loop's reference, mode and output, but not manual outputs or remote references."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["scenario-truth#example:1", "scenario-truth#example:2", "scenario-truth#example:3", "scenario-truth#example:4", "scenario-truth#test_the_regulated_variable_is_found_behind_the_whole_observation_chain"]

[[obligation]]
id = "truth.levels"
statement = "A signal is `measured` when an observation operator writes it and no observation operator reads it, `internal` when one does, and `true` otherwise."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["scenario-truth#example:2", "scenario-truth#example:1", "scenario-truth#test_the_regulated_variable_is_found_behind_the_whole_observation_chain"]

[[obligation]]
id = "truth.roles-from-structure"
statement = "Roles are inferred from the graph and are relations to a loop: for each pid, the regulated variable (found by walking back through the observation chain behind its process-variable input), the measured signal, reference (setpoint and remote setpoint), mode, manual output and manipulated variable; a signal may hold several roles, also of several loops. A signal with no loop role has a global one: parameter, exogenous, measured, observation stage or free state."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["scenario-truth#example:1", "scenario-truth#example:2", "scenario-truth#example:3", "scenario-truth#example:4", "scenario-truth#test_the_regulated_variable_is_found_behind_the_whole_observation_chain"]

[[obligation]]
id = "truth.loops"
statement = "Each pid is a loop named by its id, with its controller, output, measured, regulated, reference, remote reference, mode and manual signals and its output limits (defaults 0 and 100)."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["scenario-truth#example:1", "scenario-truth#example:3", "scenario-truth#test_the_regulated_variable_is_found_behind_the_whole_observation_chain", "scenario-truth#example:28"]

[[obligation]]
id = "truth.causal-graph"
statement = "The causal graph has every signal as a node and an edge from each connected input (and each promoted parameter signal) of an operator to each of its outputs; an edge is instantaneous when the input has direct feedthrough to the output in the same step, and promoted parameters always do."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["scenario-truth#example:1", "scenario-truth#example:2", "scenario-truth#example:3", "scenario-truth#example:4", "scenario-truth#example:14", "scenario-truth#test_only_the_parameters_an_event_targets_are_signals", "scenario-truth#example:26", "scenario-truth#example:27"]

[[obligation]]
id = "truth.invalid-scenarios-have-no-truth"
statement = "A scenario that is invalid has no ground truth: asking for it is an error (here ValueError), not an empty or partial answer."
