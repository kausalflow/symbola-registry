# Obligations of the kausalflow/homeostat spec pack (format: docs/PACK_FORMAT.md).
#
# Each obligation is one decision a builder could get wrong, with the checks
# that pin it down. status: decided (required), default (chosen; a fork may
# change it with a note), open (deliberately undecided; builds may differ).
# Checks are "<component>#example:<line in examples.jsonl>" or
# "<component>#<property test name>".

[[obligation]]
id = "issues.report-every-problem-of-a-stage"
statement = "validate reports all the problems of the stage that finds any, not only the first: several missing parameters, several bad expectations and targets, and several schema problems come back together."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["scenario-issues#example:31", "scenario-issues#example:85", "scenario-issues#example:86", "scenario-issues#example:90", "scenario-issues#example:99"]

[[obligation]]
id = "issues.stages"
statement = "Problems are found in six stages (text, schema and vocabulary, building, events, wiring, checks on the compiled plant) and a stage with any problem hides the problems of the later ones; the message to the user is to fix them and validate again."
status = "default"
source = "extract"
kind = "behaviour"
checks = ["scenario-issues#example:81", "scenario-issues#example:82", "scenario-issues#example:83", "scenario-issues#example:84", "scenario-issues#example:85", "scenario-issues#example:86", "scenario-issues#test_an_earlier_stage_hides_the_problems_of_later_ones", "scenario-issues#example:90", "scenario-issues#example:99", "scenario-issues#example:102"]

[[obligation]]
id = "issues.location-at-the-offending-key"
statement = "An issue is located at the offending key as a path: dotted keys with bracketed list positions (`exogenous[0].source.tau`, `interventions[2]`, `expect[1].signal`); an unknown or misspelt key is located at that key, and a missing key at the key that is missing. Problems of a custom operator found while building are located `custom[i]: <id>` or `custom[i]: <id>.<param or port>`; wiring problems found after building are located `<id>.<port>` or `<id>`."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["scenario-issues#example:12", "scenario-issues#example:13", "scenario-issues#example:11", "scenario-issues#example:20", "scenario-issues#example:30", "scenario-issues#example:32", "scenario-issues#example:35", "scenario-issues#example:38", "scenario-issues#example:40", "scenario-issues#example:46", "scenario-issues#example:48", "scenario-issues#example:66", "scenario-issues#test_an_unknown_top_level_key_is_the_only_problem_and_is_located_at_it", "scenario-issues#test_an_unknown_operator_name_is_located_at_its_op_key", "scenario-issues#example:95", "scenario-issues#example:105", "scenario-issues#example:107"]

[[obligation]]
id = "issues.did-you-mean"
statement = "A misspelt key, operator, port, signal, loop or template gets the closest known name as a hint in the fix (SequenceMatcher ratio of at least 0.6, best first); a name with nothing close gets none."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["scenario-issues#example:12", "scenario-issues#example:13", "scenario-issues#example:23", "scenario-issues#example:29", "scenario-issues#example:30", "scenario-issues#example:35", "scenario-issues#example:40", "scenario-issues#example:41", "scenario-issues#example:66", "scenario-issues#example:67", "scenario-issues#test_a_misspelt_key_gets_its_nearest_name", "scenario-issues#example:105", "scenario-issues#example:106"]

[[obligation]]
id = "issues.fix-offered"
statement = "Every problem carries a suggested fix except an E_SCHEMA error for a value of the wrong type or form; issues are structured (code, location, reason, fix) and the wording of reason and fix is not part of the contract."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["scenario-issues#test_issues_are_sorted_distinct_and_every_non_schema_error_has_a_fix", "scenario-issues#example:49", "scenario-issues#example:38", "scenario-issues#example:100", "scenario-issues#example:101", "scenario-issues#example:103", "scenario-issues#example:112", "scenario-issues#example:113", "scenario-issues#example:114", "scenario-issues#example:115", "scenario-issues#example:116", "scenario-issues#example:117"]

[[obligation]]
id = "issues.sorted-report"
statement = "The contract reports issues sorted by (location, code) and without repeats, so that outputs compare as plain data; the order of the original's own list is incidental."
status = "default"
source = "extract"
kind = "constraint"
reason = "Normalization of the contract's output, not behaviour of the product."
checks = ["scenario-issues#test_issues_are_sorted_distinct_and_every_non_schema_error_has_a_fix", "scenario-issues#example:101"]

[[obligation]]
id = "issues.valid-scenarios-pass"
statement = "A scenario whose operators are wired acyclically through existing signals and whose numbers are within range is valid, and has no warnings; a minimal scenario needs only a duration."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["scenario-issues#example:1", "scenario-issues#example:2", "scenario-issues#example:4", "scenario-issues#example:65", "scenario-issues#example:72", "scenario-issues#example:52", "scenario-issues#example:55", "scenario-issues#example:34", "scenario-issues#example:47", "scenario-issues#example:75", "scenario-issues#test_acyclic_scenarios_with_in_range_values_are_valid", "scenario-issues#example:91"]

[[obligation]]
id = "issues.text-forms"
statement = "A scenario given as YAML text, JSON text or an object is the same scenario (JSON is YAML); text that is not YAML is E_YAML, and text or a value that is not a mapping is E_SCHEMA at `scenario`."
status = "decided"
source = "extract"
kind = "behaviour"
assumes = ["K-yaml-reads-the-scenario-as-written"]
checks = ["scenario-issues#example:5", "scenario-issues#example:6", "scenario-issues#example:7", "scenario-issues#example:8", "scenario-issues#example:9", "scenario-issues#example:10", "scenario-issues#test_text_and_object_forms_agree"]

[[obligation]]
id = "issues.malformed-input-is-reported"
statement = "Any malformed scenario is reported as issues and never raises an exception: ok is exactly 'no errors', errors have E_ codes, warnings W_ codes, and an invalid scenario has no warnings."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["scenario-issues#test_malformed_input_is_reported_never_raised", "scenario-issues#example:10", "scenario-issues#example:89", "scenario-issues#example:94"]

[[obligation]]
id = "issues.durations"
statement = "Durations are numbers of seconds or strings of number+unit parts (ms, s, sec, min, h, hr, d, w; spaces and a leading sign allowed); dt and duration must be positive, duration a whole multiple of dt, output.every a whole multiple of dt, and noise_keys one per lane, each reported as E_SCHEMA at its key."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["scenario-issues#example:3", "scenario-issues#example:6", "scenario-issues#example:14", "scenario-issues#example:15", "scenario-issues#example:16", "scenario-issues#example:17", "scenario-issues#example:24", "scenario-issues#example:96", "scenario-issues#example:118"]

[[obligation]]
id = "issues.schema-shape"
statement = "A scenario has exactly the stated keys at each level; an exogenous entry has exactly one of source and from, an intervention a value or a fault, a stat/shift expectation at least one bound, and an expectation a known kind."
