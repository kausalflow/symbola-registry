[[obligation]]
id = "schedule.vaccine-status"
statement = "A vaccine dose is 'due' from half a month before its usual age, 'late' after the plan's upto age (default usual age + 2 months), 'missed' after the plan's until age, 'later' before; doses recorded count per vaccine, a dose recorded against several vaccines counts for each, deleted doses do not; all doses recorded is 'done'."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["schedule#example:1", "schedule#example:2", "schedule#example:3", "schedule#example:4", "schedule#example:5", "schedule#example:6", "schedule#example:7", "schedule#example:8", "schedule#example:9", "schedule#example:10", "schedule#example:11", "schedule#test_vaccine_status_follows_the_age_and_the_doses"]

