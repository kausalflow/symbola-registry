statement = "A room expires at its last write plus the retention time (null for an empty room or retention 0, which never expires; the welcome says when); presence and joining do not move it; an expiry sweep deletes only rooms that are due and have nobody connected (open connections postpone it by a day); an expired room is free again and a new link key may take it."
status = "decided"
