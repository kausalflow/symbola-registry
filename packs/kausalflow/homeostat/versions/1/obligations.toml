source = "extract"
kind = "behaviour"
checks = ["scenario-issues#example:18", "scenario-issues#example:19", "scenario-issues#example:21", "scenario-issues#example:59", "scenario-issues#example:22", "scenario-issues#example:23", "scenario-issues#example:20", "scenario-issues#example:108"]

[[obligation]]
id = "issues.library-and-templates"
statement = "Templates, faults, measurements, degradations and maintenance need a library (E_SCHEMA at `library` when absent); an uninstalled library is E_UNKNOWN_LIBRARY, a pin that is not the installed major version E_LIBRARY_VERSION, an unknown template E_UNKNOWN_TEMPLATE at `units[i].template`."
