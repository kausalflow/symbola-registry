name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The CLI is pinned in .symbolon-version, so a CLI change reaches the registry only when the pin moves.
      - run: pip install "git+https://github.com/kausalflow/symbolon@$(cat .symbolon-version)"
      # The checks every pack submission must pass.
      - run: symbolon site check packs
  # Rebuild the website (spikinglabs/symbolon-store, on Cloudflare Pages) after a merge.
  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "No CLOUDFLARE_DEPLOY_HOOK secret yet; skipping."; exit 0; fi
          curl -fsS -X POST "$HOOK"
