source = "extract"
kind = "behaviour"
checks = ["merge#example:18", "merge#example:19", "merge#example:20", "merge#example:21", "merge#test_covered_means_every_item_is_there_and_as_new"]

[[obligation]]
id = "merge.unknown-parts"
statement = "Top-level parts of the Drive file that this version does not know (added by a later version) are written back unchanged; known keys are app, v, savedAt, example, settings, child, drive, recalls, docTr and the 14 collections."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["merge#example:22", "merge#example:23"]

[[obligation]]
id = "migrate.version"
statement = "A log's format version is its v if that is a positive integer, else 1. The current version is 3. A log of a higher version, or anything that is not an object, is returned unchanged and reported as too new."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["migrate#example:6", "migrate#example:7", "migrate#example:8", "migrate#example:9", "migrate#example:10", "migrate#test_a_current_log_is_not_touched", "migrate#test_a_newer_log_is_left_alone_and_reported"]

[[obligation]]
id = "migrate.v1"
statement = "Version 1 (the old sick-day log) becomes version 2 by building a fresh empty log that takes over only children, episodes, measurements, meds (or the two starting medicines) and settings (over the defaults); each entry gets the child of its illness; the selected child is the first child that is not deleted. Nothing else is carried over."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["migrate#example:1", "migrate#example:2", "migrate#test_old_entries_get_their_child_from_the_illness"]

[[obligation]]
id = "migrate.v2"
statement = "Version 2 becomes 3 by moving the book photos kept in vaccines and checkups (kind 'page') into documents and pages, with deterministic ids, times and tombstones, so two phones that upgrade separately end up with the same log."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["migrate#example:3", "migrate#example:4", "migrate#example:5", "migrate#test_every_photo_becomes_one_page_and_a_tombstone", "migrate#test_upgrading_twice_gives_the_same_log"]

[[obligation]]
id = "migrate.keep-before"
statement = "Adding a collection or fields needs no version change (older apps keep parts they do not know); changing what existing data means needs the next version, a migration step and a test. Before a migration step runs, the log as it was is kept: as 'before-vN' (N the new version) in the phone's database and as backups/aura-log-before-vN.json in Drive (once); these copies are never pruned. An older app never writes a newer log."
status = "decided"
source = "extract"
kind = "constraint"
reason = "A bad migration must always be undoable by the parent."
checks = []
unchecked = "An end-to-end test that upgrades a saved old log on the phone and in a Drive stand-in and finds both copies, then runs the previous version's build against the new log and sees nothing written."

[[obligation]]
id = "migrate.v-less-log"
statement = "A log without a valid v is treated as version 1. The step from 1 to 2 converts the old collections and keeps every other collection and field of the log as it is, so a damaged or hand-edited log never loses data."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["migrate#example:7", "migrate#example:8", "migrate#example:11"]

[[obligation]]
id = "save.too-new"
statement = "A log of a newer format version is never saved by this app."
status = "decided"
source = "extract"
kind = "security"
checks = ["save-guard#example:8"]

[[obligation]]
id = "save.well-formed"
statement = "A log is saved only if it is an object with settings, all 14 collections are lists, and every item is an object with an id that is not missing or null (0 and '' are fine)."
status = "decided"
source = "extract"
kind = "security"
checks = ["save-guard#example:9", "save-guard#example:10", "save-guard#example:11", "save-guard#example:12"]

[[obligation]]
id = "save.no-shrink"
statement = "A log with fewer items (over all collections) than the last saved one is not saved, and a refused save does not lower that bar; equal or larger logs are saved. Deletions are tombstones, so the count only falls when the parent removes everything."
status = "decided"
source = "extract"
kind = "security"
checks = ["save-guard#example:1", "save-guard#example:2", "save-guard#example:3", "save-guard#example:4", "save-guard#example:13", "save-guard#test_without_permission_a_smaller_log_is_never_saved"]

[[obligation]]
id = "save.shrink-exceptions"
statement = "A smaller log may be saved when the last saved log was example data, or when the parent chose something that removes items (allow_shrink, used up by the next save that passes the format checks)."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["save-guard#example:5", "save-guard#example:6", "save-guard#test_the_guard_follows_its_rules_over_a_run_of_saves"]

[[obligation]]
id = "save.allow-shrink-once"
statement = "allow_shrink is used up by the next save attempt, whatever its outcome: a save refused as too new or malformed clears it too, so a later save that did not ask for it is refused if it shrinks."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["save-guard#example:7"]

[[obligation]]
id = "growth.tables"
statement = "Percentiles use the WHO tables as given in fixtures/who-lms.json (L, M, S per month by sex: 2006 standards to 5 years, 2007 reference after; weight to 10 y, height to 19 y, head to 5 y), interpolated linearly in L, M and S between whole months."
status = "decided"
source = "extract"
kind = "behaviour"
assumes = ["K-who-tables"]
checks = ["growth-percentile#example:1", "growth-percentile#example:2", "growth-percentile#example:3", "growth-percentile#example:4", "growth-percentile#example:6", "growth-percentile#example:7", "growth-percentile#example:13", "growth-percentile#example:14", "growth-percentile#example:15", "growth-percentile#example:36", "growth-percentile#example:37", "growth-percentile#example:38", "growth-percentile#test_the_curves_are_the_tables_interpolated", "growth-percentile#test_a_measurement_on_a_curve_is_at_that_percentile"]

[[obligation]]
id = "growth.age"
statement = "Age in months is (measurement time - birth date at 00:00 UTC) / 30.4375 days, with fractions; at birth the first row is used."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["growth-percentile#example:5", "growth-percentile#example:6"]

[[obligation]]
id = "growth.z-and-cdf"
statement = "z = ((value/M)^L - 1)/(L*S) and the percentile is 100 times the normal distribution function computed with the Abramowitz and Stegun 7.1.26 approximation given in the description, not an exact one."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["growth-percentile#example:1", "growth-percentile#example:2", "growth-percentile#example:11", "growth-percentile#example:12", "growth-percentile#test_a_higher_value_is_never_a_lower_percentile"]

[[obligation]]
id = "growth.weight-adjustment"
statement = "For weight only, beyond 3 SD either way z is replaced by WHO's adjustment (3 SD plus the distance beyond, counted in steps of the 2-to-3 SD distance); height and head are not adjusted."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["growth-percentile#example:8", "growth-percentile#example:9", "growth-percentile#example:10", "growth-percentile#test_weight_beyond_three_sd_is_adjusted_and_other_measures_are_not"]

[[obligation]]
id = "growth.no-table"
statement = "Without sex f or m, a birth date, a value, or a table row for that age (before birth, beyond 10 y for weight, 19 y for height, 5 y for head), there is no percentile: all outputs are null."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["growth-percentile#example:16", "growth-percentile#example:17", "growth-percentile#example:18", "growth-percentile#example:19", "growth-percentile#example:20", "growth-percentile#example:21", "growth-percentile#example:22", "growth-percentile#example:23", "growth-percentile#example:39", "growth-percentile#example:40", "growth-percentile#example:41", "growth-percentile#test_no_table_no_answer"]

[[obligation]]
id = "growth.wording"
statement = "A percentile is described only as 'below 1st percentile', 'above 99th percentile' or the rounded (halves up) number with its English ordinal and 'percentile'; no wording judges it (no 'too small', 'normal', 'worrying')."
status = "decided"
source = "extract"
kind = "constraint"
reason = "A percentile only compares with other children; the pediatrician interprets it."
checks = ["growth-percentile#example:11", "growth-percentile#example:12", "growth-percentile#example:24", "growth-percentile#example:25", "growth-percentile#example:26", "growth-percentile#example:27", "growth-percentile#example:28", "growth-percentile#example:29", "growth-percentile#example:30", "growth-percentile#example:31", "growth-percentile#example:32", "growth-percentile#example:33", "growth-percentile#example:34", "growth-percentile#example:35", "growth-percentile#test_the_wording_only_describes"]

[[obligation]]
id = "schedule.tables"
statement = "The schedules are the German ones as of 2026: STIKO standard vaccinations (RSV antibody, rotavirus, 6-in-1, pneumococcus, meningococcus B, MMR, chickenpox, Tdap and Tdap-polio boosters, HPV, meningococcus ACWY; MenC at 12 months dropped, MenACWY at 12 to 14 years added), the U-Heft checkups U1 to U9, U10 (new, paid from 2027) and J1, and the dental checkups Z1 to Z6, with exactly the ages and periods in the description."
