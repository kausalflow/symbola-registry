[[obligation]]
id = "series.settled-start"
statement = "A run starts settled, noise off, at the steady state of the initial values (first_order y = K u, lag y = u), so an event at time 0 changes the inputs, not the starting state."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["run-series#example:5", "run-series#example:2", "run-series#test_first_order_responses_follow_the_exact_exponential_whatever_dt"]

[[obligation]]
id = "series.exact-discretization"
statement = "Dynamics are discretized exactly for an input held over each step, so the response at the grid times does not depend on dt: first_order and lag follow y = y_inf + (y_0 - y_inf) exp(-(t - t0)/tau) for a step at t0, whatever dt divides t0."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["run-series#example:2", "run-series#example:10", "run-series#test_first_order_responses_follow_the_exact_exponential_whatever_dt"]

[[obligation]]
id = "series.schedule-events"
statement = "A schedule holds its value until an event: set, shift and scale act on the value held (events at the same time in written order), a ramp is linear from the step that applies it to the target over its duration, and `lanes` limits an event to some lanes."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["run-series#example:6", "run-series#example:3", "run-series#example:4", "run-series#example:11", "run-series#test_a_ramp_is_linear_from_the_step_that_applies_it", "run-series#test_events_set_shift_and_scale_the_held_value"]

