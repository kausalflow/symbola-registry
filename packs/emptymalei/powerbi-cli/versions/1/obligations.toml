# Obligations of the emptymalei/powerbi-cli spec pack (format: docs/PACK_FORMAT.md).
#
# Each obligation is one decision a builder could get wrong, with the checks
# that pin it down. status: decided (required), default (chosen; a fork may
# change it with a note), open (deliberately undecided; builds may differ).
# Checks are "<component>#example:<line in examples.jsonl>" or
# "<component>#<property test name>". A required obligation no check can
# express yet has checks = [] and unchecked = "<the check it would need>".

[[obligation]]
id = "auth.token-prefix"
statement = "A token given as `Bearer <token>` is stored without the prefix."
status = "decided"
checks = [
  "auth-profiles#example:2",
  "auth-profiles#test_auth_saves_the_token_and_activates_the_profile_when_none_is"
]

[[obligation]]
id = "auth.activation"
statement = "Without `-g` a saved profile becomes the ungrouped active profile when none is active, or when it is named `default`; with `-g` it becomes the group's active profile when the group has none. An existing active profile otherwise stays, and a grouped save leaves the ungrouped profiles alone."
status = "decided"
checks = [
  "auth-profiles#example:1",
  "auth-profiles#example:3",
  "auth-profiles#example:5",
  "auth-profiles#example:6",
  "auth-profiles#example:7",
  "auth-profiles#test_auth_saves_the_token_and_activates_the_profile_when_none_is"
]

[[obligation]]
id = "auth.token-per-name"
statement = "Tokens are kept once per profile name in `~/.pbi_cli/credentials.json` (a JSON object, indent 2), shared by the ungrouped and grouped profiles of that name: saving replaces the token, deleting a profile deletes it, even if another list still has a profile of that name."
status = "decided"
assumes = ["K-keyring-optional"]
checks = [
  "auth-profiles#example:1",
  "auth-profiles#example:8",
  "auth-profiles#example:26",
  "auth-profiles#test_auth_saves_the_token_and_activates_the_profile_when_none_is",
  "auth-profiles#test_delete_removes_the_profile_and_its_token_and_promotes_the_first_remaining"
]

[[obligation]]
id = "auth.credentials-private"
statement = "The credentials file is readable and writable only by its owner (mode 600)."
status = "decided"
kind = "security"
assumes = ["K-keyring-optional"]
checks = []
unchecked = "A check that reports the permission bits of the files a command wrote; the harness reports only their content."

[[obligation]]
id = "auth.keyring"
statement = "When an OS keyring works, tokens are stored there (service `pbi-cli`, user name = profile name) and read from there first; the credentials file is only the fallback, also when the keyring raises any error."
status = "decided"
kind = "security"
assumes = ["K-keyring-optional"]
checks = []
unchecked = "A run against a fake keyring backend, which the harness does not provide."

[[obligation]]
id = "auth.legacy-import"
statement = "Old installations keep working: a legacy `profiles.json` is imported into a new `config.yaml`, and a legacy `auth.json` token becomes the ungrouped profile `default` when there are no ungrouped profiles."
status = "default"
checks = [
  "auth-profiles#example:9",
  "auth-profiles#example:12"
]

[[obligation]]
id = "auth.resolution"
statement = "A command uses the active profile of its group (`user`, or `admin` for the admin-only commands) if that is one of the group's profiles; otherwise the ungrouped active profile, which must be one of the ungrouped profiles; it then needs a token for it. A group profile without a token does not fall back. Failures exit 1 with an `Error:` line naming the group or profile."
status = "decided"
checks = [
  "auth-profiles#example:29",
  "auth-profiles#example:30",
  "auth-profiles#example:31",
  "auth-profiles#example:32",
  "auth-profiles#example:33",
  "auth-profiles#example:34",
  "auth-profiles#example:35",
  "auth-profiles#example:36",
  "auth-profiles#example:37",
  "auth-profiles#example:38",
  "auth-profiles#example:39",
  "auth-profiles#test_user_commands_take_the_user_groups_profile_else_the_ungrouped_one",
  "auth-profiles#test_admin_commands_fail_the_same_way_naming_the_admin_group"
]

