source = "extract"
kind = "behaviour"
checks = ["scenario-issues#example:56", "scenario-issues#example:57", "scenario-issues#example:58", "scenario-issues#example:53", "scenario-issues#example:54", "scenario-issues#example:55", "scenario-issues#example:109"]

[[obligation]]
id = "issues.plan-references"
