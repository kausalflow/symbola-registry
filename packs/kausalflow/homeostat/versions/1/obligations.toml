source = "extract"
kind = "behaviour"
checks = ["scenario-truth#example:14", "scenario-truth#example:15", "scenario-truth#example:18", "scenario-truth#example:24", "scenario-truth#test_only_the_parameters_an_event_targets_are_signals", "scenario-truth#example:25"]

[[obligation]]
id = "truth.event-log-times"
