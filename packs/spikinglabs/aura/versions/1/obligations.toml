id = "retention.hourly"
statement = "Before overwriting the Drive file the app saves it as aura-backup-YYYY-MM-DD-HH.json in Aura/backups, at most once per local hour (not again if that name exists, not again after a snapshot this hour), then prunes."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["backup-retention#example:8", "backup-retention#example:9", "backup-retention#example:10", "backup-retention#example:12", "backup-retention#example:13", "backup-retention#test_one_copy_an_hour_and_only_hourly_copies_are_pruned"]

[[obligation]]
id = "retention.before-upgrade"
statement = "aura-log-before-vN.json copies and any foreign files in the backups folder are never pruned."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["backup-retention#example:11", "backup-retention#example:16", "backup-retention#test_one_copy_an_hour_and_only_hourly_copies_are_pruned"]

[[obligation]]
id = "retention.phone-copies"
statement = "The phone keeps one copy of the whole log per local day (snap-YYYY-MM-DD, newest 14) beside the log; example data is not copied; before-vN is never deleted."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["backup-retention#example:14", "backup-retention#example:15", "backup-retention#example:16", "backup-retention#example:17", "backup-retention#example:18", "backup-retention#test_the_phone_keeps_14_daily_copies"]

[[obligation]]
id = "retention.restore"
statement = "Restoring from a Drive backup or a daily copy adds back anything missing (a merge); it never deletes and does not undo later edits or deletions."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["merge#example:1", "merge#example:5"]

[[obligation]]
id = "sync.safe-write"
statement = "A Drive sync reads the file, merges, writes, and checks the file's version is still its own write's (else reads and merges again, up to 3 rounds, then retries after 20 s); an idle check is one small request for the version; it never writes over a file it cannot read as an Aura log; a log over 4.5 MB is written with a resumable upload; the partner's backups go to an Aura folder in their own Drive."
status = "decided"
source = "extract"
kind = "constraint"
reason = "Two phones may save at once; a clash may delay a sync but must never lose an entry."
assumes = ["K-drive-version", "K-device-clocks", "K-small-log"]
checks = []
unchecked = "A test against a Drive stand-in that interleaves a second writer between the app's read and write (rounds), serves an unreadable file, and a 5 MB log (resumable upload)."

[[obligation]]
id = "media.pack"
statement = "In a Drive backup, every direct field of an item in the synced collections that holds a base64 data URL is replaced by 'aura-media:<sha256 hex of the URL>.<ext>#<header>' and the bytes go once to backups/media under that name; names already there are not uploaded again."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["media-pack#example:1", "media-pack#example:2", "media-pack#example:5", "media-pack#test_each_distinct_picture_is_one_file_named_by_its_hash", "media-pack#test_a_name_already_in_the_folder_is_not_uploaded_again"]

[[obligation]]
id = "media.untouched"
statement = "Everything else stays as it is: non-base64 data URLs, links, values nested deeper than a field, other parts of the log."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["media-pack#example:3", "media-pack#example:4"]

[[obligation]]
id = "media.restore"
statement = "Restoring puts each reference back as header + ',' + base64 of the file, so pack then unpack gives the original log."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["media-pack#example:6", "media-pack#example:8", "media-pack#test_what_is_packed_unpacks_to_the_same_log"]

[[obligation]]
id = "media.missing"
statement = "An item whose file cannot be found in backups/media (or whose reference has no header) is left out of the restored list and counted once, so a restore never blanks a picture on the phone."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["media-pack#example:7", "media-pack#example:9", "media-pack#example:10", "media-pack#test_a_missing_file_costs_the_item_and_nothing_else"]

[[obligation]]
id = "ai.names-out"
statement = "Before any AI call, names of children (not deleted), the parent's own name and the names of people who logged entries are replaced by placeholders [CHILD], [CHILD 2]..., [PARENT 1]...; the child asked about is [CHILD]; names are put back into the answer on the phone."
status = "decided"
source = "extract"
kind = "security"
checks = ["ai-redaction#example:1", "ai-redaction#example:2", "ai-redaction#example:3", "ai-redaction#example:6", "ai-redaction#example:10", "ai-redaction#example:16", "ai-redaction#test_no_name_is_sent_and_the_answer_gets_them_back", "ai-redaction#test_the_child_asked_about_is_child_and_the_others_follow_in_order"]

[[obligation]]
id = "ai.word-boundary"
statement = "A name is replaced anywhere (any case) unless a letter of any alphabet touches it on either side; the longest name goes first; a name of one character is left (its number is still used)."
status = "decided"
source = "extract"
kind = "security"
checks = ["ai-redaction#example:4", "ai-redaction#example:5", "ai-redaction#example:7", "ai-redaction#example:8", "ai-redaction#test_a_name_inside_a_longer_word_stays"]

[[obligation]]
id = "ai.deleted-children"
statement = "Names of deleted children, and the names on deleted entries, are replaced like any other, because they can still be in notes; deleted children are numbered after the live ones."
status = "decided"
source = "extract"
kind = "security"
checks = ["ai-redaction#example:9", "ai-redaction#example:19"]

[[obligation]]
id = "ai.restore"
statement = "Placeholders are replaced by names in every string of the answer at any depth; keys and other values stay; placeholders the model invented stay as written."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["ai-redaction#example:11", "ai-redaction#example:12"]

[[obligation]]
id = "ai.sent-text"
statement = "The system text is sent with the sentence 'Names are replaced by placeholders such as [CHILD]; keep each placeholder exactly as written.' appended, and 'See exactly what was sent' shows the system text and the redacted user text exactly as sent."
status = "decided"
source = "extract"
kind = "security"
checks = ["ai-redaction#example:1", "ai-redaction#example:13"]

[[obligation]]
id = "ai.images"
statement = "Images (pages of the vaccination book or U-Heft, only when the parent switched reading on and was asked once) go only to the parent's own AI service (key needed); with another provider the call fails; with AI off the call fails first."
status = "decided"
source = "extract"
kind = "security"
checks = ["ai-redaction#example:13", "ai-redaction#example:14", "ai-redaction#example:15", "ai-redaction#example:17", "ai-redaction#example:18", "ai-redaction#test_images_need_the_own_service_and_are_counted"]

[[obligation]]
id = "ai.nothing-else"
statement = "Photos, sounds, links, birth dates (age is sent instead), contacts and insurance data never go into a prompt; AI is off until the parent chooses a service and gives a key, which stays on the phone and is never synced; only https addresses (or http://localhost) are accepted."
status = "decided"
source = "extract"
kind = "security"
assumes = ["K-ai-service"]
checks = []
unchecked = "A review and a network trace of every AI feature (Say it, handover, page reading, translation) with an AI stub: prompts contain no photo, sound, link, birth date, contact or insurance data; the key never appears in the synced log."

[[obligation]]
id = "ics.shape"
statement = "The calendar file is RFC 5545: CRLF lines (also at the end), VCALENDAR with VERSION 2.0, PRODID -//Aura//Baby log//EN, CALSCALE GREGORIAN, METHOD PUBLISH, one VEVENT per event with UID '<uid>@aura' and DTSTAMP in UTC."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["ics#example:1", "ics#example:6", "ics#test_the_file_has_the_stated_shape", "ics#test_each_event_is_written_as_stated"]

[[obligation]]
id = "ics.all-day-and-timed"
statement = "A date is an all-day event (DTSTART/DTEND;VALUE=DATE, end = next day) so it never shifts with the time zone; a booked appointment with a time is a one-hour event in local time (no zone letter)."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["ics#example:1", "ics#example:2", "ics#example:4", "ics#example:5"]

[[obligation]]
id = "ics.alarms"
statement = "Reminders: a timed event gets one the day before (-P1D) and one an hour before (-PT1H); an all-day event one at 9:00 on the day (PT9H); each is a display alarm with the title."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["ics#example:1", "ics#example:2", "ics#example:4"]

[[obligation]]
id = "ics.booked"
statement = "A booked appointment carries URL (the app's address plus ?open=appts); a timed booked one is OPAQUE, everything else TRANSPARENT; LOCATION only when there is one."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["ics#example:2", "ics#example:3"]

[[obligation]]
id = "ics.escape"
statement = "In text values every backslash, ';' and ',' gets a backslash and a line break becomes \\n (RFC 5545)."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["ics#example:7", "ics#test_each_event_is_written_as_stated"]

[[obligation]]
id = "ics.fold"
statement = "Lines are folded at 75 octets of UTF-8 (RFC 5545): each physical line, including the space that starts a continuation, is at most 75 octets; pieces are filled greedily and a character is never split."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["ics#example:8", "ics#example:9", "ics#example:10", "ics#test_the_file_has_the_stated_shape"]

[[obligation]]
id = "ics.filename"
statement = "A single event is saved as aura-<title up to ' ·', lower-cased, runs of non a-z0-9 as '-'>.ics; several events as aura-dates.ics."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["ics#example:11", "ics#example:12", "ics#example:6", "ics#example:15", "ics#test_the_file_name_and_the_google_link"]

[[obligation]]
id = "ics.google-link"
statement = "For one event the Google Calendar link is calendar.google.com/calendar/render with action=TEMPLATE, text, dates (start/end as in the file), details and location (if any), form-urlencoded; for several events there is none."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["ics#example:1", "ics#example:13", "ics#example:14", "ics#example:15", "ics#test_several_events_have_a_general_name_and_no_link"]
