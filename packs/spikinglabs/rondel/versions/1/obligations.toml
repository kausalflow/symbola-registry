[[obligation]]
id = "crypto.auth"
statement = "From the link key and the room, HKDF-SHA256 (salt `rondel:<room>`) gives an AES-GCM content key (info `content-v1`) and a 32-byte proof (info `auth-v1`, sent as standard base64); keys are URL-safe base64 (the last character of a 43-character key carries two bits, so spellings of the same bytes agree), the room is part of the salt, and the server never learns the key."
status = "decided"
source = "extract"
kind = "security"
checks = ["link-crypto#example:1", "link-crypto#example:2", "link-crypto#example:3", "link-crypto#example:4", "link-crypto#example:5", "link-crypto#test_auth_is_hkdf_of_the_link_key"]

[[obligation]]
id = "crypto.seal-open"
statement = "A sealed text is base64 of nonce (12 bytes) + AES-GCM ciphertext + tag (16 bytes); every seal uses a fresh nonce; only the right key and room open it, damage and too-short input are detected as errors; sealing nothing leaves nonce and tag."
status = "decided"
source = "extract"
kind = "security"
checks = ["link-crypto#example:8", "link-crypto#example:9", "link-crypto#example:10", "link-crypto#example:11", "link-crypto#example:12", "link-crypto#example:13", "link-crypto#example:14", "link-crypto#test_sealed_text_has_a_nonce_ciphertext_and_tag_and_opens_again", "link-crypto#test_each_seal_uses_a_fresh_nonce", "link-crypto#test_only_the_right_key_and_room_open_it_and_damage_is_detected"]

[[obligation]]
id = "crypto.stored-updates-open"
statement = "An update stored by Rondel 0.26.0 or 0.27.0 still opens with its link key, so meetings saved by older releases keep working."
status = "decided"
source = "extract"
kind = "security"
checks = ["link-crypto#example:6", "link-crypto#example:7"]

