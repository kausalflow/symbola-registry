kind = "security"
checks = ["backup#example:5", "backup#example:6", "backup#test_two_protected_files_of_the_same_data_differ"]

[[obligation]]
id = "backup.merge"
statement = "Restoring merges into the browser and never removes anything: the browser's own settings, voter ids and identity stay (or the identity is taken over on request, keeping the browser's name if it has one); meeting, series and template lists are unions without duplicates (ties keep the browser's entry, newer wins, own first); drafts and own cards merge by id; layouts the browser lacks are taken; entries that are not JSON are skipped; merging again changes nothing and reports zero counts."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["backup#example:12", "backup#example:13", "backup#example:14", "backup#example:15", "backup#example:16", "backup#example:17", "backup#example:18", "backup#example:19", "backup#example:20", "backup#example:21", "backup#example:22", "backup#example:23", "backup#test_merging_loses_nothing_and_a_second_merge_changes_nothing"]

[[obligation]]
id = "room.hello"
statement = "The first message must be `hello` (protocol, proof, since); the room answers `welcome` with the seq, the stored entries after `since`, the peer count and the expiry; the first client sees nobody, the second sees the first and the first is told; anything before hello is an error; a second hello, non-JSON, unknown messages and bad fields are errors that keep the connection or close it as the protocol says."
status = "decided"
source = "extract"
kind = "behaviour"
checks = ["room#example:1", "room#example:4", "room#example:7", "room#example:9", "room#example:20", "room#example:21", "room#test_a_newcomer_gets_what_is_after_since"]

[[obligation]]
id = "room.auth"
statement = "The first hello registers the proof (a string of at least 16 characters); later hellos must present the same proof, a different one is `forbidden` and the connection is closed; the first proof stays valid after the room slept."
status = "decided"
source = "extract"
kind = "security"
checks = ["room#example:5", "room#example:6", "room#example:12", "room#test_only_the_first_proof_is_accepted_afterwards"]

[[obligation]]
id = "room.version"
